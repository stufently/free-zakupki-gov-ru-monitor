name: Release

# Релиз выпускается АВТОМАТИЧЕСКИ по bump'у версии в extension/manifest.json.
# Достаточно смержить в main изменение version — workflow сам создаст тег vX.Y.Z
# и опубликует Release со сборкой. Ручной шаг с тегом убран намеренно: это было
# место, где выпуск забывали, и правка не доезжала до тех, кто ставит ZIP.
#
# Если тег на текущую версию уже существует, публикация тихо пропускается —
# обычные коммиты в main (README, тесты) релиз не плодят.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Что сделать в Chrome Web Store"
        type: choice
        default: upload-and-publish
        options:
          # publish-only нужен не для красоты: если пакет уже принят, а publish
          # упал, повторная загрузка той же версии будет отклонена как
          # неувеличенная — и повторить выкладку целиком стало бы нечем.
          - upload-and-publish
          - upload-only
          - publish-only

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # нужны все теги, чтобы понять, выпущена ли уже эта версия

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Read version and decide whether to release
        id: ver
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Тег v$VERSION уже существует — релиз пропускаем."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Версия v$VERSION ещё не выпущена — будет создан тег и Release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "${{ steps.ver.outputs.version }}" \
            || { echo "::error::тег v$TAG не совпадает с version=${{ steps.ver.outputs.version }} в manifest.json"; exit 1; }

      - name: Run parser tests
        working-directory: tests
        run: |
          npm ci --silent --no-audit --no-fund
          node run.mjs

      - name: Guard service worker
        working-directory: tests
        run: node check-sw.mjs

      # Гоняем здесь, а не только в test.yml: этот же скрипт через несколько
      # шагов пойдёт выкладывать версию в Store.
      - name: Test Chrome Web Store deploy script
        working-directory: tests
        run: node cws-deploy.test.mjs

      - name: Build ZIP
        run: |
          mkdir -p dist
          cd extension
          zip -r "../dist/free-zakupki-gov-ru-monitor-${{ steps.ver.outputs.version }}.zip" . \
            -x "*.DS_Store" "*.map"
          cd ..
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip

      - name: Create GitHub Release
        # Тег создаётся самим действием из tag_name на текущем коммите,
        # поэтому отдельный git tag / git push не нужен.
        #
        # Только с main (или с тега): иначе ручной прогон на ветке с bump'ом —
        # единственный способ проверить выкладку в Store, не отправляя версию на
        # ревью, — заодно выпускал бы Release и вешал тег на коммит из ветки.
        if: >-
          (steps.ver.outputs.should_release == 'true' && github.ref == 'refs/heads/main')
          || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          name: v${{ steps.ver.outputs.version }}
          body: |
            Автоматическая сборка версии `${{ steps.ver.outputs.version }}` из `manifest.json`.

            Что изменилось — см. [CHANGELOG.md](https://github.com/stufently/free-zakupki-gov-ru-monitor/blob/main/CHANGELOG.md).

            ## Установка

            1. Скачайте `free-zakupki-gov-ru-monitor-${{ steps.ver.outputs.version }}.zip` ниже.
            2. Распакуйте в любую папку.
            3. Откройте `chrome://extensions`, включите режим разработчика.
            4. Нажмите «Загрузить распакованное расширение» и выберите распакованную папку.

            Если предпочитаете git: `git clone https://github.com/stufently/free-zakupki-gov-ru-monitor.git` и выберите подпапку `extension/`.


            > **Важно:** с 4 июля 2026 года zakupki.gov.ru работает на TLS-сертификате НУЦ Минцифры,
            > которому Chrome не доверяет по умолчанию. Если ленты не читаются — установите корневые
            > сертификаты по инструкции [gosuslugi.ru/crt](https://www.gosuslugi.ru/crt)
            > либо пользуйтесь Яндекс.Браузером или Атомом.

  # Выкладка в Chrome Web Store отдельной job'ой, а не шагом в build: сборка и
  # GitHub Release не должны зависеть от доступности стороннего API. Если Store
  # ответит отказом, релиз на GitHub уже опубликован и виден.
  store:
    name: Chrome Web Store
    needs: build
    # workflow_dispatch в условии не для удобства: если выкладка упала (протух
    # токен, Store ответил отказом), тег на эту версию уже создан, should_release
    # навсегда стал false — и без ручного запуска повторить выкладку было бы
    # нечем, кроме bump'а версии на пустом месте.
    if: >-
      needs.build.outputs.should_release == 'true'
      || startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # fetchStatus отдаёт состояние последней загрузки товара целиком, а не
    # конкретного вызова. Два одновременных запуска опрашивали бы чужую загрузку
    # и могли опубликовать не ту ревизию. cancel-in-progress: false — прерывать
    # выкладку на полпути хуже, чем подождать.
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download built ZIP
        uses: actions/download-artifact@v7
        with:
          name: extension-zip
          path: dist

      - name: Upload to Chrome Web Store
        # Секреты объявлены на шаге, а не на job: checkout и download-artifact в
        # них не нуждаются, а лишний step с доступом к refresh_token — лишняя
        # поверхность для утечки.
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          # На push поле пустое — обе проверки дают true, то есть загрузить и
          # опубликовать. Режим выбирается только при ручном запуске.
          CWS_UPLOAD: ${{ github.event.inputs.mode != 'publish-only' }}
          CWS_PUBLISH: ${{ github.event.inputs.mode != 'upload-only' }}
        run: |
          # Секреты нельзя проверить в `if:` на уровне job — контекст secrets там
          # недоступен, поэтому проверяем здесь.
          MISSING=""
          for NAME in CWS_PUBLISHER_ID CWS_ITEM_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            [ -z "${!NAME}" ] && MISSING="$MISSING $NAME"
          done

          if [ -n "$MISSING" ]; then
            # В форке секретов нет и быть не должно — там пропускаем молча.
            if [ "$GITHUB_REPOSITORY" != "stufently/free-zakupki-gov-ru-monitor" ]; then
              echo "::notice::Форк без секретов Chrome Web Store — выкладка пропущена."
              exit 0
            fi
            # А в основном репозитории это отказ, а не «нечего делать»: товар
            # опубликован, и пропущенная выкладка означала бы зелёный релиз с
            # устаревшей версией в Store. Раньше здесь был notice + exit 0 —
            # это было верно ровно до того, как секреты появились.
            echo "::error::Не заданы секреты Chrome Web Store:$MISSING. Версия собрана и GitHub Release выпущен, но в Store не уехала. Задайте секреты и повторите ручным запуском в режиме upload-and-publish."
            exit 1
          fi

          bash scripts/cws-deploy.sh dist/free-zakupki-gov-ru-monitor-${{ needs.build.outputs.version }}.zip
