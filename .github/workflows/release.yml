name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Read version from manifest
        id: ver
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version extension/manifest.json)
          test "$TAG" = "$MANIFEST" \
            || { echo "::error::тег v$TAG не совпадает с version=$MANIFEST в manifest.json"; exit 1; }

      - name: Run parser tests
        working-directory: tests
        run: |
          npm ci --silent --no-audit --no-fund
          node run.mjs

      - name: Guard service worker
        working-directory: tests
        run: node check-sw.mjs

      - name: Build ZIP
        run: |
          mkdir -p dist
          cd extension
          zip -r "../dist/free-zakupki-gov-ru-monitor-${{ steps.ver.outputs.version }}.zip" . \
            -x "*.DS_Store" "*.map"
          cd ..
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          name: v${{ steps.ver.outputs.version }}
          body: |
            Автоматическая сборка из тега `${{ github.ref_name }}`.

            ## Установка

            1. Скачайте `free-zakupki-gov-ru-monitor-${{ steps.ver.outputs.version }}.zip` ниже.
            2. Распакуйте в любую папку.
            3. Откройте `chrome://extensions`, включите режим разработчика.
            4. Нажмите «Загрузить распакованное расширение» и выберите распакованную папку.

            Если предпочитаете git: `git clone https://github.com/stufently/free-zakupki-gov-ru-monitor.git` и выберите подпапку `extension/`.
