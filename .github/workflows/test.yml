name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Run parser tests
        working-directory: tests
        run: |
          npm ci --silent --no-audit --no-fund
          node run.mjs

      - name: Guard service worker (no DOM APIs, offscreen present, locales intact)
        working-directory: tests
        run: node check-sw.mjs

      - name: Test Chrome Web Store deploy script (against a local mock)
        working-directory: tests
        run: node cws-deploy.test.mjs

      - name: Validate manifest.json
        run: |
          jq empty extension/manifest.json
          jq -r .manifest_version extension/manifest.json | grep -q "^3$"
          jq -r .version extension/manifest.json | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$"

  smoke:
    # Загружает расширение в настоящий Chromium. Юнит-тесты идут с полифилом
    # DOMParser и потому не заметили, что в 0.1.0 расширение не работало вовсе.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm i --silent --no-audit --no-fund playwright-core@1.60.0
          npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Smoke test extension in Chromium
        env:
          EXT_DIR: ${{ github.workspace }}/extension
        run: xvfb-run -a node tests/smoke-chrome.cjs
