]

[[faq]]
q = "Как установить расширение для мониторинга zakupki.gov.ru?"
a = "Скачайте ZIP со страницы релизов на GitHub, распакуйте, откройте chrome://extensions, включите режим разработчика и нажмите «Загрузить распакованное расширение». Публикация в Chrome Web Store готовится."

[[faq]]
q = "Куда уходят мои поисковые запросы?"
a = "Никуда. RSS-ссылки и история найденных закупок хранятся в chrome.storage.local на вашем компьютере, HTTP-запросы идут только напрямую на zakupki.gov.ru."

[[faq]]
q = "Работает ли расширение в Edge, Яндекс.Браузере, Brave и Opera?"
a = "Да, все эти браузеры на Chromium и поддерживают расширения Chrome MV3. Firefox пока не поддерживается."

[[faq]]
q = "Расширение работает, когда браузер закрыт?"
a = "Нет. В Chrome MV3 service worker живёт, только пока запущен браузер. Для мониторинга 24/7 нужна связка сервер плюс Telegram-бот."

[[faq]]
q = "Почему лента пустая или не открывается с 4 июля 2026?"
a = "zakupki.gov.ru перешёл на TLS-сертификат НУЦ Минцифры, которого нет в Chrome, Edge и Brave, и фоновый запрос к ленте обрывается. Установите корневые сертификаты по инструкции gosuslugi.ru/crt или используйте Яндекс.Браузер."

[[faq]]
q = "Как часто можно опрашивать RSS?"
a = "Минимум раз в минуту — это ограничение chrome.alarms. По умолчанию 10 минут, в настройках можно поставить от 1 минуты до недели."
